<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- CHANGE 1: Updated Title -->
    <title>Unity Web Player | Cosmic_Elements</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Portrait orientation styles for mobile */
      .unity-mobile-portrait {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .unity-mobile-portrait #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* Landscape orientation styles for desktop */
      .unity-desktop-landscape {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      .unity-desktop-landscape #unity-canvas {
        /*
        * Note: These are the canvas's internal resolution dimensions.
        * CSS max-width/max-height will handle the scaling.
        */
        width: 1920px !important;
        height: 1080px !important;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain; /* This ensures the aspect ratio is maintained */
      }

      /* Hide UI elements on mobile portrait mode */
      .unity-mobile-portrait #unity-footer,
      .unity-mobile-portrait #unity-fullscreen-button {
        display: none !important;
      }

      /* Ensure loading bar is visible */
      #unity-loading-bar {
        z-index: 1000;
        position: relative;
      }

      /* Mobile portrait specific adjustments */
      @media screen and (max-width: 768px) and (orientation: portrait) {
        body {
          margin: 0;
          padding: 0;
          overflow: hidden;
        }
        
        #unity-container {
          position: fixed !important;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
        }
      }

      /* Desktop landscape specific adjustments */
      @media screen and (min-width: 769px) {
        body {
          margin: 0;
          padding: 20px;
          background: #232323; /* Dark grey background for desktop */
        }
        
        #unity-container {
          background: #000;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
      }
    </style>
  </head>
  <body>
    <!-- The main container will have its class changed by the script -->
    <div id="unity-container" class="unity-desktop">
      <!-- The script will set the correct width/height on the canvas -->
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <!-- CHANGE 2: Updated Build Title -->
        <div id="unity-build-title">Cosmic_Elements</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Function to set canvas size based on device and orientation
      function setCanvasSize() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile) {
          // Mobile device: Force portrait mode styling and resolution
          container.className = "unity-mobile-portrait";
          canvas.className = "unity-mobile-portrait";
          
          canvas.width = 1080;
          canvas.height = 1920;
          
          let meta = document.querySelector('meta[name="viewport"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'viewport';
            document.getElementsByTagName('head')[0].appendChild(meta);
          }
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          
        } else {
          // Desktop device: Force landscape mode styling and resolution
          container.className = "unity-desktop-landscape";
          canvas.className = "unity-desktop-landscape";

          canvas.width = 1920;
          canvas.height = 1080;
        }
      }

      // --- IMPORTANT: CONFIGURATION UPDATED FOR YOUR GAME ---
      var buildUrl = "Build";
      // CHANGE 3: Using your game's file names
      var loaderUrl = buildUrl + "/Cosmic_Elements.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Cosmic_Elements.data",
        frameworkUrl: buildUrl + "/Cosmic_Elements.framework.js",
        codeUrl: buildUrl + "/Cosmic_Elements.wasm",
        streamingAssetsUrl: "StreamingAssets",
        // CHANGE 4: Updated company and product info
        companyName: "DefaultCompany",
        productName: "Cosmic_Elements",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Set initial canvas size on load
      setCanvasSize();

      // Listen for orientation changes and resize events to re-apply the logic
      window.addEventListener('orientationchange', function() {
        setTimeout(setCanvasSize, 100); // Small delay for accuracy
      });

      window.addEventListener('resize', setCanvasSize);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                
                // Only show fullscreen button on desktop
                const fullscreenButton = document.querySelector("#unity-fullscreen-button");
                if (fullscreenButton && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                  fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                  };
                } else if (fullscreenButton) {
                  fullscreenButton.style.display = 'none';
                }
                
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
