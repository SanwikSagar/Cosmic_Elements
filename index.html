<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | AstroidDestroyer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Portrait orientation styles for mobile */
      .unity-mobile-portrait {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .unity-mobile-portrait #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* Landscape orientation styles for desktop */
      .unity-desktop-landscape {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      .unity-desktop-landscape #unity-canvas {
        width: 1920px !important;
        height: 1080px !important;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }

      /* Hide UI elements on mobile portrait mode */
      .unity-mobile-portrait #unity-footer,
      .unity-mobile-portrait #unity-fullscreen-button {
        display: none !important;
      }

      /* Ensure loading bar is visible */
      #unity-loading-bar {
        z-index: 1000;
        position: relative;
      }

      /* Mobile portrait specific adjustments */
      @media screen and (max-width: 768px) and (orientation: portrait) {
        body {
          margin: 0;
          padding: 0;
          overflow: hidden;
        }
        
        #unity-container {
          position: fixed !important;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
        }
      }

      /* Desktop landscape specific adjustments */
      @media screen and (min-width: 769px) {
        body {
          margin: 0;
          padding: 20px;
          background: #232323;
        }
        
        #unity-container {
          background: #000;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">AstroidDestroyer</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Function to set canvas size based on device and orientation
      function setCanvasSize() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isPortrait = window.innerHeight > window.innerWidth;
        
        if (isMobile) {
          // Mobile device: Force portrait mode (1080x1920)
          container.className = "unity-mobile-portrait";
          canvas.className = "unity-mobile-portrait";
          
          // Set canvas resolution to portrait
          canvas.width = 1080;
          canvas.height = 1920;
          
          // Add viewport meta for mobile
          let meta = document.querySelector('meta[name="viewport"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'viewport';
            document.getElementsByTagName('head')[0].appendChild(meta);
          }
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          
          console.log("🔄 Mobile Portrait Mode: 1080x1920");
          
        } else {
          // Desktop device: Force landscape mode (1920x1080)
          container.className = "unity-desktop-landscape";
          canvas.className = "unity-desktop-landscape";
          
          // Set canvas resolution to landscape
          canvas.width = 1920;
          canvas.height = 1080;
          
          console.log("🔄 Desktop Landscape Mode: 1920x1080");
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Asteroid_destroyer.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Asteroid_destroyer.data",
        frameworkUrl: buildUrl + "/Asteroid_destroyer.framework.js",
        codeUrl: buildUrl + "/Asteroid_destroyer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AstroidDestroyer",
        productVersion: "1.1",
        showBanner: unityShowBanner,
      };

      // Set initial canvas size
      setCanvasSize();

      // Listen for orientation changes and resize events
      window.addEventListener('orientationchange', function() {
        setTimeout(setCanvasSize, 100); // Small delay to ensure orientation change is complete
      });

      window.addEventListener('resize', function() {
        setCanvasSize();
      });

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                
                // Only show fullscreen button on desktop
                const fullscreenButton = document.querySelector("#unity-fullscreen-button");
                if (fullscreenButton && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                  fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                  };
                } else if (fullscreenButton) {
                  fullscreenButton.style.display = 'none';
                }

                console.log("✅ Unity instance loaded successfully");
                
              }).catch((message) => {
                console.error("❌ Unity load failed:", message);
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
